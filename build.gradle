buildscript {
    repositories {
        // These repositories are only for Gradle plugins, put any other repositories in the repository block further below
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}

apply plugin: 'org.spongepowered.mixin'

// Mods.toml description (multi-line, matches Dead Air style: sections, colons, short paragraphs).
ext.deadLettersModDescription = """Turns loot chests into scattered archives of final words. Each note belongs to a story; you collect parts in order per player while many stories run in parallel—no checklist grind, just fragments you chase across the world.

You can add custom stories without building a datapack:
Put folders in config/deadletters/stories/<Story Name>/ with story.json and part_1.txt, part_2.txt, … or part_N.json (simple .txt mode: first line is title; remaining non-empty lines are body). Restart or run /reload. The default root is config/deadletters/stories (change customStories.path in the common config if you want another folder under config/).

Extra stories for pack authors: add data/<namespace>/deadletters/stories/<story_id>/ with story.json and notes/part_N.json, or ship the same folder layout under config for players.

How it works:
Dead Letters loads built-in jar stories plus datapack and config stories on reload, merges them into one registry, and rolls weighted note drops when loot applies. With progression enabled, story order advances when you read a part; loot eligibility follows that progression (and duplicate rules). Chest note injection runs once the scrapbook is unlocked—usually your first opened chest can place the starter book (configurable). Options cover spawn chance, chest caps, duplicates, multi-story rolls, first Lootr chest and starter-scrapbook behaviour, part-weight tuning, custom story paths, and debug tooling.

Lootr fit: notes behave as normal loot; Lootr chests stay per-player, so drops respect each listener’s own progression. Lootr Liaison keeps structure container finalization stable in Lootr packs—run both for the intended stack.

How to use it:
Unlock the scrapbook (pick it up from a chest or keep it in inventory—see defaults in config). Then loot chests for a chance at notes, use the Dead Letters creative tab for any loaded part, right-click a note for the parchment reader, place notes in the world or on lecterns, and use Add to Notebook from a note to archive a copy. Long notes paginate; turn pages with the arrow buttons beside the parchment (arrows hide when there is no previous or next page).

Further options: config/dead_letters-common.toml—general.spawnChance, maxNotesPerChest, useProgression, allowDuplicates, partOneDropWeight, finalPartDropWeight, guaranteeFirstLootrChest, guaranteeStarterScrapbookFirstChest; stories.enableMultipleStories; customStories.*; debug.*

Server commands (cheats / operator):
/deadletters debug stories — list loaded stories and note counts
/deadletters debug state — show progression snapshot for the caller
/deadletters debug reset — clear saved progression and container stamps (testing)
/deadletters debug roll <count> — simulate weighted rolls against the current pool (1–5000)
/deadletters debug give <noteId> — give one note by id (e.g. code_zero_01)

Dependencies:
Required: Lootr, Lootr Liaison, AzureLib

Dead Letters does not replace Lootr—it adds narrative fragments, per-player story order, a scrapbook archive flow, and readable note UI on top of per-player chest loot."""

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    // The mappings can be changed at any time and must be in the following format.
    // Channel:   Version:
    // official   MCVersion             Official field/method names from Mojang mapping files
    // parchment  YYYY.MM.DD-MCVersion  Open community-sourced parameter names and javadocs layered on top of official
    //
    // You must be aware of the Mojang license when using the 'official' or 'parchment' mappings.
    // See more information here: https://github.com/MinecraftForge/MCPConfig/blob/master/Mojang.md
    //
    // Parchment is an unofficial project maintained by ParchmentMC, separate from MinecraftForge
    // Additional setup is needed to use their mappings: https://parchmentmc.org/docs/getting-started
    //
    // Use non-default mappings at your own risk. They may not always work.
    // Simply re-run your setup task after changing the mappings to update your workspace.
    mappings channel: mapping_channel, version: mapping_version

    // When true, this property will have all Eclipse/IntelliJ IDEA run configurations run the "prepareX" task for the given run configuration before launching the game.
    // In most cases, it is not necessary to enable.
    // enableEclipsePrepareRuns = true
    // enableIdeaPrepareRuns = true

    // This property allows configuring Gradle's ProcessResources task(s) to run on IDE output locations before launching the game.
    // It is REQUIRED to be set to true for this template to function.
    // See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
    copyIdeResources = true

    // When true, this property will add the folder name of all declared run configurations to generated IDE run configurations.
    // The folder name can be set on a run configuration using the "folderName" property.
    // By default, the folder name of a run configuration is the name of the Gradle project containing it.
    // generateRunFolders = true

    // This property enables access transformers for use in development.
    // They will be applied to the Minecraft artifact.
    // The access transformer file can be anywhere in the project.
    // However, it must be at "META-INF/accesstransformer.cfg" in the final mod jar to be loaded by Forge.
    // This default location is a best practice to automatically put the file in the right place in the final jar.
    // See https://docs.minecraftforge.net/en/latest/advanced/accesstransformers/ for more information.
    // accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        // applies to all the run configs below
        configureEach {
            workingDirectory project.file('run')

            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            property 'forge.logging.markers', 'REGISTRIES'


            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            // example of overriding the workingDirectory set in configureEach above
            workingDirectory project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"

    config "${mod_id}.mixins.json"
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    // Put repositories for dependencies here
    // ForgeGradle automatically adds the Forge maven and Maven Central for you
    maven {
        name = 'AzureDoom Mods'
        url = 'https://maven.azuredoom.com/mods'
    }

    // If you have mod jar dependencies in ./libs, you can declare them as a repository like so.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html#sub:flat_dir_resolver
    flatDir {
        dir 'libs'
    }
}

dependencies {
    // Specify the version of Minecraft to use.
    // Any artifact can be supplied so long as it has a "userdev" classifier artifact and is a compatible patcher artifact.
    // The "userdev" classifier will be requested and setup by ForgeGradle.
    // If the group id is "net.minecraft" and the artifact id is one of ["client", "server", "joined"],
    // then special handling is done to allow a setup of a vanilla dependency without the use of an external repository.
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    // Prebuilt ESC 2.0.1 via flatDir + fg.deobf (includeBuild ESC currently fails to compile)
    implementation fg.deobf("blank:extraspecialcore:${esc_version}+${minecraft_version}-forge")

    implementation fg.deobf("mod.azure.azurelib:azurelib-neo-1.20.1:3.1.8")

    // Example mod dependency with JEI - using fg.deobf() ensures the dependency is remapped to your development mappings
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly fg.deobf("mezz.jei:jei-${mc_version}-common-api:${jei_version}")
    // compileOnly fg.deobf("mezz.jei:jei-${mc_version}-forge-api:${jei_version}")
    // runtimeOnly fg.deobf("mezz.jei:jei-${mc_version}-forge:${jei_version}")

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation fg.deobf("blank:coolmod-${mc_version}:${coolmod_version}")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
// When "copyIdeResources" is enabled, this will also run before the game launches in IDE environments.
// See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [minecraft_version   : minecraft_version, minecraft_version_range: minecraft_version_range,
                             forge_version       : forge_version, forge_version_range: forge_version_range,
                             loader_version_range: loader_version_range,
                             mod_id              : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
                             mod_authors         : mod_authors, mod_description: deadLettersModDescription,
                             esc_version_range   : esc_version_range,]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

// Example for how to get properties into the manifest for reading at runtime.
tasks.named('jar', Jar).configure {
    archiveFileName = "${mod_id}-${version}+${minecraft_version}-forge.jar"
    manifest {
        attributes(["Specification-Title"     : mod_id,
                    "Specification-Vendor"    : mod_authors,
                    "Specification-Version"   : "1", // We are version 1 of ourselves
                    "Implementation-Title"    : project.name,
                    "Implementation-Version"  : project.jar.archiveVersion,
                    "Implementation-Vendor"   : mod_authors,
                    "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")])
    }

    // This is the preferred method to reobfuscate your jar file
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

def deadLettersPlanFile = file('gradle/deadletters-plan.txt')
def deadLettersDebugFile = file('gradle/deadletters-debug-log.txt')
def cIdeasTestModsDir = file('C:/Users/Ksivi/curseforge/minecraft/Instances/C.Ideas/mods')

tasks.register('deadLettersPlan') {
    group = 'deadletters'
    description = 'Prints the implementation plan reference file path.'
    doLast {
        println "Dead Letters implementation plan: ${deadLettersPlanFile}"
    }
}

tasks.register('deadLettersDebugLog') {
    group = 'deadletters'
    description = 'Prints the bugfix/debug log reference file path.'
    doLast {
        println "Dead Letters bugfix/debug log: ${deadLettersDebugFile}"
    }
}

tasks.register('installToCIdeasTestInstance', Copy) {
    group = 'deadletters'
    description = 'Copies the freshly built mod jar into the C.Ideas Forge test modpack.'
    dependsOn tasks.named('reobfJar')
    from(tasks.named('jar'))
    into(cIdeasTestModsDir)
    doFirst {
        delete fileTree(cIdeasTestModsDir) {
            include "${mod_id}-*.jar"
        }
    }
}

tasks.register('buildAndInstallTest') {
    group = 'deadletters'
    description = 'Builds a fresh jar and installs it to the C.Ideas Forge test instance.'
    dependsOn tasks.named('clean'), tasks.named('installToCIdeasTestInstance')
}

tasks.named('build').configure { finalizedBy 'installToCIdeasTestInstance' }

