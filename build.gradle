plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

tasks.named('jar', Jar).configure {
    archiveFileName = "${mod_id}-${version}+${minecraft_version}-neoforge.jar"
    from('CHANGELOG.md') {
        into '.'
    }
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude('**/*.bbmodel')
    exclude('src/generated/**/.cache')
}

repositories {
    maven {
        name = 'AzureDoom Mods'
        url = 'https://maven.azuredoom.com/mods'
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
    }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "uk.co.extraspecialstudio:extraspeciallib:${esl_version}"
    implementation "uk.co.extraspecialstudio:extraspecialcore:${esc_version}"

    // Local jar (downloaded from Modrinth) is reliable; AzureDoom maven can time out.
    implementation files("libs/azurelib-neo-1.21.1-${azurelib_version}.jar")
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            esc_version_range      : esc_version_range,
            esl_version_range      : esl_version_range,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    filteringCharset = 'UTF-8'
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.register('copyToNeoForgeTestPack') {
    dependsOn 'jar'
    doLast {
        def jar = tasks.named('jar', Jar).get().archiveFile.get().asFile
        def dest = file("${System.getProperty('user.home')}/curseforge/minecraft/Instances/NEOFORGE 1.21.1 TESTS/mods")
        if (dest.exists()) {
            dest.listFiles({ f -> f.name.startsWith('dead_letters-') && f.name.endsWith('.jar') } as FileFilter)?.each { it.delete() }
            copy { from jar; into dest }
            println "Copied ${jar.name} to ${dest}"
        } else {
            println "NeoForge test pack mods folder not found: ${dest}"
        }
    }
}

tasks.named('build').configure { finalizedBy 'copyToNeoForgeTestPack' }

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
